<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHD-Pi Platform</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-purple { background: #673ab7; color: white; border: none; padding: 15px 25px; border-radius: 30px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .hidden { display: none; }
        .menu-item { background: #eee; padding: 15px; margin: 5px; border-radius: 10px; cursor: pointer; font-weight: bold; color: #673ab7; }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo_whd.png" alt="Logo" style="width: 80px; margin-bottom: 10px;">
        
        <div id="loading">Memuat Pi SDK...</div>

        <div id="auth-section" class="hidden">
            <h1>WHD-Pi Ecosystem</h1>
            <p>Klik tombol di bawah untuk masuk</p>
            <button class="btn-purple" id="login-button">MASUK DENGAN PI</button>
        </div>

        <div id="main-section" class="hidden">
            <h2 id="user-greeting">Halo, Pioneer!</h2>
            <div id="menu-grid">
                <div class="menu-item" onclick="alert('Membuka E-Learning...')">📚 E-Learning</div>
                <div class="menu-item" onclick="alert('Membuka Shop...')">🛒 E-Commerce</div>
            </div>
        </div>
    </div>

    <script>
        // Mengikuti panduan: https://pi-apps.github.io/pi-sdk-docs/platform
        const Pi = window.Pi;

        // 1. Inisialisasi SDK
        try {
            Pi.init({ version: "2.0", sandbox: true }); // Pastikan sandbox: true jika belum di-mainnet
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            console.log("Pi SDK Initialized");
        } catch (err) {
            document.getElementById('loading').innerText = "Gagal memuat SDK. Gunakan Pi Browser!";
        }

        // 2. Fungsi Authenticate (Ditempelkan langsung ke ID Tombol)
        document.getElementById('login-button').addEventListener('click', function() {
            const scopes = ['username', 'payments'];

            function onIncompletePaymentFound(payment) {
                console.log("Ada pembayaran tertunda:", payment);
            };

            Pi.authenticate(scopes, onIncompletePaymentFound).then(function(auth) {
                console.log("Login sukses!", auth.user.username);
                
                // Update UI
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-section').classList.remove('hidden');
                document.getElementById('user-greeting').innerText = "Halo, " + auth.user.username;
            }).catch(function(error) {
                console.error("Login gagal:", error);
                alert("Login Gagal: " + error.message);
            });
        });
    </script>
</body>
</html>
