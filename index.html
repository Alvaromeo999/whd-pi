<!DOCTYPE html>
<html>
<head>
    <title>WHD-Pi Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="status-sdk" style="color: red;">SDK Belum Siap...</div>
    
    <div id="auth-area">
        <button id="btn-login" style="padding: 20px; width: 100%; font-size: 20px;">
            TEKAN UNTUK LOGIN
        </button>
    </div>

    <div id="menu-area" style="display: none;">
        <h1>Selamat Datang!</h1>
        <button onclick="alert('E-Learning')" style="padding: 15px;">📚 E-Learning</button>
        <button onclick="alert('Shop')" style="padding: 15px;">🛒 Shop</button>
    </div>

    <script>
        // 1. Tes apakah script terbaca
        console.log("Script dimuat");

        // 2. Inisialisasi SDK dengan penanganan error
        try {
            window.Pi.init({ version: "2.0", sandbox: true });
            document.getElementById('status-sdk').innerText = "SDK SIAP (Sandbox)";
            document.getElementById('status-sdk').style.color = "green";
        } catch (e) {
            document.getElementById('status-sdk').innerText = "SDK GAGAL: " + e.message;
        }

        // 3. Pasang fungsi klik SECARA MANUAL setelah halaman dimuat
        document.getElementById('btn-login').onclick = function() {
            console.log("Tombol ditekan");
            alert("Tombol Berhasil Merespon! Memulai Authenticate...");
            
            const scopes = ['username', 'payments'];
            function onIncompletePaymentFound(payment) { console.log(payment); };

            window.Pi.authenticate(scopes, onIncompletePaymentFound)
                .then(function(auth) {
                    alert("Login Berhasil: " + auth.user.username);
                    document.getElementById('auth-area').style.display = 'none';
                    document.getElementById('menu-area').style.display = 'block';
                })
                .catch(function(err) {
                    alert("Error Pi: " + err.message);
                });
        };
    </script>
</body>
</html>
