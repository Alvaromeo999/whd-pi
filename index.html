<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHD-Pi App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --p: #673ab7; --g: #ffa500; }
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-height: 400px; }
        .logo { width: 80px; }
        .btn { background: var(--p); color: white; border: none; padding: 15px; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; display: block; }
        .menu-grid { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .item { background: #eee; padding: 15px; border-radius: 10px; cursor: pointer; color: var(--p); font-weight: bold; font-size: 12px; }
        .full { grid-column: span 2; }
        .page { display: none; text-align: left; }
        #user-sec { display: none; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo_whd.png" alt="WHD Logo" class="logo">
        
        <div id="home-head">
            <h1 style="color:var(--p); margin-bottom:0;">WHD-Pi</h1>
            <p style="font-size:12px; color:#666;">Whole Human Development</p>
        </div>

        <button id="btn-login" class="btn" onclick="handleAuth()">Login ke WHD-Pi</button>

        <div id="user-sec">
            <p id="msg" style="font-weight: bold;"></p>
            <div class="menu-grid" id="menu-area" style="display: grid;">
                <div class="item" onclick="nav('learn')">📚 E-Learning</div>
                <div class="item" onclick="nav('shop')">🛒 E-Commerce</div>
                <div class="item full" onclick="nav('mark')">📈 E-Marketing & Community</div>
            </div>
        </div>

        <div id="p-learn" class="page">
            <h3>📚 E-Learning</h3>
            <div style="background:#000; height:150px; border-radius:10px; color:#fff; display:flex; align-items:center; justify-content:center;">Video Ready</div>
            <button class="btn" style="background:#666;" onclick="back()">Kembali</button>
        </div>

        <div id="p-shop" class="page">
            <h3>🛒 E-Commerce</h3>
            <p>Modul WHD - 1 Pi</p>
            <button class="btn" onclick="alert('Bayar Pi...')">Beli</button>
            <button class="btn" style="background:#666;" onclick="back()">Kembali</button>
        </div>

        <div id="p-mark" class="page">
            <h3>📈 Marketing</h3>
            <p>Networking & Community</p>
            <button class="btn" style="background:#666;" onclick="back()">Kembali</button>
        </div>
    </div>

    <script>
        // Inisialisasi SDK Langsung
        window.Pi.init({ version: "2.0", sandbox: true });

        async function handleAuth() {
            try {
                const scopes = ['username', 'payments'];
                const auth = await window.Pi.authenticate(scopes, (p) => {});
                
                document.getElementById('msg').innerText = "Halo, " + auth.user.username;
                document.getElementById('btn-login').style.display = 'none';
                document.getElementById('user-sec').style.display = 'block';
                console.log("Login Sukses");
            } catch (e) {
                alert("Buka di Pi Browser!");
            }
        }

        function nav(id) {
            // Sembunyikan semua
            document.getElementById('user-sec').style.display = 'none';
            document.getElementById('home-head').style.display = 'none';
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            
            // Tampilkan yang dipilih
            document.getElementById('p-' + id).style.display = 'block';
        }

        function back() {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('user-sec').style.display = 'block';
            document.getElementById('home-head').style.display = 'block';
        }
    </script>
</body>
</html>
