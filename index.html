<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHD-PI — Portal Manajemen</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* fallback style jika style.css belum kebaca */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 25px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
    }
    .logo { font-weight: bold; color: #4f46e5; }
    nav a { margin-left: 20px; text-decoration: none; color: #333; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    .hero {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .btn-primary {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #4f46e5;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
    .features .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="logo">WHD-PI</div>
    <nav>
      <a href="#features">Fitur</a>
      <a href="#contact">Kontak</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>WHD-PI — Portal Manajemen Proyek</h1>
      <p>Versi HTML sederhana untuk GitHub Pages.</p>
      <a href="#features" class="btn-primary">Jelajahi Fitur</a>
    </section>

    <section id="features" class="features">
      <h2>Fitur Utama</h2>
      <div class="grid">
        <div class="card">Manajemen Proyek</div>
        <div class="card">Laporan Otomatis</div>
        <div class="card">Integrasi API</div>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2>Kontak</h2>
      <p>Email: support@whd-pi.local</p>
    </section>
  </main>

  <footer class="footer">© 2025 WHD-PI</footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
