<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WHD-Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-link { display: block; background: #673ab7; color: white; padding: 15px; margin: 10px 0; border-radius: 30px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; width: 100%; font-size: 16px; }
        .item-link { background: #eee; color: #673ab7; padding: 20px; border-radius: 15px; text-decoration: none; font-weight: bold; font-size: 14px; display: block; border: 1px solid #ddd; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .full { grid-column: span 2; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo_whd.png" style="width:80px;">
    <div id="section-home">
        <h1 style="color:#673ab7;">WHD-Pi</h1>
        <button class="btn-link" onclick="startLogin()">LOGIN SEKARANG</button>
    </div>

    <div id="section-menu" class="hidden">
        <p id="user-name" style="font-weight:bold;"></p>
        <div class="grid">
            <div class="item-link" onclick="showPage('E-Learning')">📚 E-Learning</div>
            <div class="item-link" onclick="showPage('Shop')">🛒 E-Commerce</div>
            <div class="item-link full" onclick="showPage('Marketing')">📈 Community</div>
        </div>
    </div>

    <div id="section-page" class="hidden">
        <h2 id="page-title"></h2>
        <div style="background:#000; color:#fff; height:150px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
            Content Area
        </div>
        <button class="btn-link" style="background:#666;" onclick="goBack()">KEMBALI</button>
    </div>
</div>

<script>
    // Inisialisasi SDK tanpa paksaan sandbox
    window.Pi.init({ version: "2.0", sandbox: true });

    async function startLogin() {
        try {
            console.log("Memulai Login...");
            const scopes = ['username', 'payments'];
            const auth = await window.Pi.authenticate(scopes, (p) => {});
            
            document.getElementById('user-name').innerText = "Halo, " + auth.user.username;
            document.getElementById('section-home').classList.add('hidden');
            document.getElementById('section-menu').classList.remove('hidden');
        } catch (err) {
            alert("Gunakan Pi Browser untuk Login!");
        }
    }

    function showPage(title) {
        document.getElementById('page-title').innerText = title;
        document.getElementById('section-menu').classList.add('hidden');
        document.getElementById('section-page').classList.remove('hidden');
    }

    function goBack() {
        document.getElementById('section-page').classList.add('hidden');
        document.getElementById('section-menu').classList.remove('hidden');
    }
</script>

</body>
</html>
